[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcap-visualizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
	"scapy",
]

[dependency-groups]
dev = [
	"pytest",
	"coverage"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src/pcap_visualizer"]